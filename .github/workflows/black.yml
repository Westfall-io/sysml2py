name: Format code

# The library is DETERMINISTICALLY GENERATED — byte-identity with the lab's
# `sysml2py-lab generate` output is a hard contract, so this job only
# VERIFIES formatting (never auto-commits rewritten bytes, which would break
# the determinism guarantee).
#
# The generated src/ is guaranteed ruff-clean by the lab's own gate
# (test_generated_code_passes_ruff); black's defaults differ from the
# generator's emission preferences, so black --check applies to tests/ only.
# Tool versions are pinned so a new black/ruff release cannot redden branches
# with zero code change.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify formatting (no rewrite)
        run: |
          pip install black==24.10.0 ruff==0.6.9
          black --check tests/
          ruff check src/sysml2py tests/

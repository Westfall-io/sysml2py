name: Test Commit

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the generated library (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest tests/ -q

      - name: Build wheel + sdist and assert contents
        run: |
          pip install build
          python -m build --outdir /tmp/ci-dist .
          python - <<'EOF'
          import glob, zipfile
          from importlib.metadata import version
          wheels = glob.glob("/tmp/ci-dist/*.whl")
          assert wheels, "no wheel built"
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          assert any(n.endswith("provenance.py") for n in names), "provenance missing"
          assert all(not n.endswith(".tx") for n in names), "unexpected .tx in wheel"
          expected = f"sysml2py-{version('sysml2py')}"
          fname = wheels[0].split("/")[-1]
          assert fname.replace("-", "").startswith(expected.replace("-", "")), (
              f"{fname} != expected {expected}"
          )
          print("wheel ok:", fname)
          EOF

      - name: Import-graph purity smoke (no textx/astropy/yaml/lab)
        run: |
          python - <<'EOF'
          import sys
          import sysml2py
          loaded = {m.split('.')[0] for m in sys.modules}
          forbidden = {'textx', 'astropy', 'yaml', 'sysml2py_lab'}
          bad = sorted(forbidden & loaded)
          assert not bad, f"forbidden runtime deps: {bad}"
          print("clean import OK:", sysml2py.__version__)
          EOF

name: Test Commit

on:
  push:
    branches:
      - '*'
      - '!main'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the generated library (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest tests/ -q

      - name: Import-graph purity smoke (no textx/astropy/yaml/lab)
        run: |
          python - <<'EOF'
          import sys
          import sysml2py
          loaded = {m.split('.')[0] for m in sys.modules}
          forbidden = {'textx', 'astropy', 'yaml', 'sysml2py_lab'}
          bad = sorted(forbidden & loaded)
          assert not bad, f"forbidden runtime deps: {bad}"
          print("clean import OK:", sysml2py.__version__)
          EOF

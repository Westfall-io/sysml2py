name: Test Commit

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the generated library (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with pytest
        run: |
          pytest tests/ -q

      - name: Build wheel + sdist and assert contents
        env:
          SYML2PY_DIST_DIR: /tmp/ci-dist
        run: |
          pip install build
          python -m build --outdir /tmp/ci-dist .
          pytest tests/test_library.py::test_wheel_ships_provenance_only -q

      - name: Import-graph purity smoke (no textx/astropy/yaml/lab)
        run: |
          python - <<'EOF'
          import sys
          import sysml2py
          loaded = {m.split('.')[0] for m in sys.modules}
          forbidden = {'textx', 'astropy', 'yaml', 'sysml2py_lab'}
          bad = sorted(forbidden & loaded)
          assert not bad, f"forbidden runtime deps: {bad}"
          print("clean import OK:", sysml2py.__version__)
          EOF

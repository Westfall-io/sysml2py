name: Release Workflow

# Publish the generated sysml2py library to PyPI.
#
# The library is now DETERMINISTICALLY GENERATED by sysml2py-lab and
# committed into this repo (src/sysml2py/).  This workflow rebuilds the
# wheel from the committed generated source with hatchling (`python -m
# build` — the only path that exercises the sdist->wheel resolution,
# see the empty-wheel trap in the lab's release-packaging notes), verifies
# it, and publishes with the repo's PYPI_API_TOKEN secret.
#
# Triggers:
#   - version tag `v1.0.0`, `v1.1.0`, ...  -> ALWAYS publishes
#   - manual workflow_dispatch             -> build/verify only by default;
#     `publish_to_pypi: true` publishes (owner action)
#
# Artifact layout: everything stays inside the workspace.  `python -m build`
# defaults to ./dist, and gh-action-pypi-publish is a DOCKER container action
# — the runner only bind-mounts $GITHUB_WORKSPACE into the container, so a
# packages-dir outside the workspace (the first attempt used /tmp/dist) is
# invisible inside the container and yields "no packages to publish".
# Wheel and sdist go up as two single-file artifacts and merge back into
# ./dist via download-artifact@v4 (distinct filenames, no clobber).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the built wheel/sdist to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-verify:
    name: Build + verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tooling
        run: |
          python -m pip install --upgrade pip
          pip install build hatchling

      - name: Run the library test suite
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q

      - name: Build the wheel + sdist
        run: python -m build .

      - name: Resolve expected version
        # Drift-proof: on a v* tag use the tag name (minus the v); on manual
        # dispatch read the version straight from pyproject.toml so the
        # assert steps can never silently compare against a stale literal.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "EXPECTED_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            [[ -n "$VERSION" ]] || { echo "failed to read version from pyproject.toml"; exit 1; }
            echo "EXPECTED_VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Assert wheel contents (provenance + version)
        run: |
          python - <<'EOF'
          import glob, os, zipfile
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          w = wheels[0]
          names = set(zipfile.ZipFile(w).namelist())
          assert any(n.endswith("provenance.py") for n in names), "provenance missing"
          assert all(not n.endswith(".tx") for n in names), "unexpected .tx in wheel"
          expected = "sysml2py-" + os.environ["EXPECTED_VERSION"].lstrip("v")
          fname = w.split("/")[-1]
          assert fname.replace("-", "").startswith(expected.replace("-", "")), (
              f"{fname} != expected {expected}"
          )
          print("wheel ok:", fname)
          EOF

      - name: Import-graph smoke (clean venv, no heavy deps)
        run: |
          python -m venv /tmp/rel-venv
          /tmp/rel-venv/bin/pip install --quiet dist/*.whl
          /tmp/rel-venv/bin/python - <<'EOF'
          import os, sys
          import sysml2py
          forbidden = {"textx", "astropy", "yaml", "sysml2py_lab"}
          loaded = {m.split(".")[0] for m in sys.modules}
          bad = sorted(forbidden & loaded)
          assert not bad, f"forbidden runtime deps: {bad}"
          expected = os.environ["EXPECTED_VERSION"].lstrip("v").replace("-", "")
          assert sysml2py.__version__.replace("-", "") == expected, (
              f"version {sysml2py.__version__} != expected {expected}"
          )
          print("clean import OK:", sysml2py.__version__)
          EOF

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build-and-verify
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi)
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Verify dist contents before publish
        run: |
          echo "dist/ contents:"
          ls -la dist/
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "no wheel!"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "no sdist!"; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          # token auth, not Trusted Publishing — attestations need OIDC
          # (id-token: write) which contents: read does not grant, and
          # release/v1 is a moving ref; pin it off so behavior is stable.
          attestations: false
          # idempotent retry on any partial-upload edge case
          skip-existing: true

      - name: Create GitHub Release
        # Cut a GitHub Release for the tag, attaching the wheel + sdist.
        # (Tags alone don't make a Release; the Releases page showed nothing
        # past v0.5.3 until this step was added.)  Only on tag pushes — a
        # manual dispatch has no tag to release.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            sysml2py ${{ github.ref_name }} — generated SysML v2 builder library.

            Published to PyPI as `sysml2py ${{ github.ref_name }}`.
            See README for the full changelog.
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

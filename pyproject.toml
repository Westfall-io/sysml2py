[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sysml2py"
version = "1.0.1"
description = "Autogenerated SysML v2 builder library (generated by sysml2py-lab)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Westfall-io" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "astropy>=5.3",
]

[project.urls]
"Homepage" = "https://github.com/Westfall-io/sysml2py"
"Bug Tracker" = "https://github.com/Westfall-io/sysml2py/issues"

[tool.hatch.build.targets.sdist]
# src-layout MUST be preserved in the sdist or `python -m build` (wheel from
# sdist) produces an EMPTY wheel: hatchling flattens `src/sysml2py` to
# `sysml2py/` at the sdist root unless the sdist target is given an explicit
# include.  Keep the src/ prefix (verified against hatchling 1.32.4, issue
# #13 review W2-3).
include = ["src/sysml2py/**", "README.md", "pyproject.toml", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/sysml2py"]
# NOTE: do NOT add an `include` filter here.  `packages = ["src/sysml2py"]`
# selects EVERYTHING under that dir.  An `include` list on the wheel target
# is RESTRICTIVE and silently empties the wheel; keep package-data selection
# implicit.

# Formatting config is pinned here (NOT discovered by walking up), so ruff /
# black agree with `_ruff_format` regardless of where the tree is generated.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
